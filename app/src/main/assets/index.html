<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Gupta's Parcha</title><style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--danger:#dc2626;--warn:#d97706;--ok:#059669;--shadow:0 2px 12px #0000000d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;font-weight:650;cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}.top{background:#111827;color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:800}.sub{color:#cbd5e1;margin-top:3px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;background:var(--card);position:sticky;top:84px;z-index:4;border-bottom:1px solid var(--line)}.nav button{background:#f3f4f6;color:#4b5563;padding:10px 5px}.nav button.active{background:#111827;color:white}.page{padding:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--card);padding:16px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat b{font-size:28px}.stat span{display:block;color:var(--muted);margin-top:4px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}.title{font-size:18px;font-weight:800;margin:18px 0 8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.product{display:flex;gap:12px;align-items:center}.pic{width:58px;height:58px;border-radius:12px;background:#eef0f3;display:grid;place-items:center;font-size:25px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.meta{color:var(--muted);font-size:13px;margin-top:3px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.red{background:#fee2e2;color:#b91c1c}.yellow{background:#fef3c7;color:#92400e}.green{background:#d1fae5;color:#047857}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;outline:none}.chips{display:flex;gap:7px;overflow:auto;padding:10px 0}.chips button{white-space:nowrap;background:#eef0f3;color:#374151}.primary{background:#111827;color:white}.danger{background:#dc2626;color:white}.outline{background:white;border:1px solid var(--line)}.small{padding:8px 10px;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:35px 15px}.fab{position:fixed;right:18px;bottom:20px;border-radius:999px;background:#111827;color:#fff;box-shadow:0 6px 24px #0003;padding:15px 18px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:white;width:100%;max-width:760px;margin:auto;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}.statusBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.statusBtns button{background:#f3f4f6}.statusBtns button.sel-low{background:#fef3c7;color:#92400e}.statusBtns button.sel-out{background:#fee2e2;color:#b91c1c}.statusBtns button.sel-ok{background:#d1fae5;color:#047857}@media(min-width:700px){.page{padding:20px}.modal{align-items:center}.sheet{border-radius:22px;max-width:520px}}
</style></head><body><div class="app"><header class="top"><div class="brand">Gupta's Parcha</div><div class="sub">Simple stock-to-market list</div></header><nav class="nav" id="nav"></nav><main class="page" id="app"></main></div><button class="fab" onclick="openAdd()">＋ Product</button><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><script>
const KEY='guptas-parcha-v1';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{products:[],parcha:[],history:[],cats:[]};let tab='home';let search='';let filter='All';
const demo=[['Maggi 70g','Nestle','Noodles','₹12','₹14','packet'],['Parle-G 800g','Parle','Biscuits','₹55','₹60','packet'],['Fortune Oil 1L','Fortune','Grocery','₹135','₹150','ltr'],['Surf Excel 1kg','Surf Excel','Home Care','₹170','₹190','packet'],['Tata Salt 1kg','Tata','Grocery','₹25','₹30','kg'],['Dettol Soap','Dettol','Personal Care','₹32','₹38','pcs'],['Coke 750ml','Coca-Cola','Beverages','₹35','₹40','bottle']];if(!db.products.length){demo.forEach((x,i)=>db.products.push({id:i+1,name:x[0],brand:x[1],category:x[2],cost:x[3],sell:x[4],unit:x[5],freq:0,status:'ok'}));save()}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function nav(){document.getElementById('nav').innerHTML=[['home','Home'],['parcha','Parcha'],['products','Products'],['history','History']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(t){tab=t;search='';filter='All';render()}function render(){nav();({home:home,parcha:parcha,products:products,history:history}[tab])()}
function home(){let low=db.parcha.filter(x=>x.status==='low').length,out=db.parcha.filter(x=>x.status==='out').length;let freq=[...db.products].sort((a,b)=>b.freq-a.freq).slice(0,8);document.getElementById('app').innerHTML=`<div class="grid"><div class="stat"><b>${out}</b><span>Out of stock</span></div><div class="stat"><b>${low}</b><span>Low stock</span></div></div><div class="title">Live Parcha</div><div class="card"><div class="row"><div><b>${db.parcha.length} products</b><div class="meta">Only products needing purchase</div></div><button class="primary" onclick="go('parcha')">Open Parcha</button></div></div><div class="title">🔥 Frequently ordered</div><input class="search" placeholder="Find a product quickly…" oninput="quickSearch(this.value)"><div id="freq">${freqCards(freq)}</div>`}
function quickSearch(v){search=v;document.getElementById('freq').innerHTML=freqCards([...db.products].filter(p=>p.name.toLowerCase().includes(v.toLowerCase())).sort((a,b)=>b.freq-a.freq).slice(0,12))}function freqCards(list){if(!list.length)return '<div class="empty">No matching products</div>';return list.map(p=>`<div class="card"><div class="row"><div class="product"><div class="pic">📦</div><div><b>${esc(p.name)}</b><div class="meta">${esc(p.brand)} · ${esc(p.unit)} · ordered ${p.freq}×</div></div></div><button class="small outline" onclick="addToParcha(${p.id})">Low / Out</button></div></div>`).join('')}
function parcha(){let list=db.parcha;document.getElementById('app').innerHTML=`<div class="row"><div><div class="title" style="margin-top:5px">Today's Live Parcha</div><div class="meta">Items not fully bought stay here automatically.</div></div>${list.length?`<button class="outline small" onclick="clearBought()">Bought history</button>`:''}</div>${list.length?list.map(item=>{let p=db.products.find(q=>q.id===item.pid);return `<div class="card"><div class="product"><div class="pic">📦</div><div><b>${esc(p?.name||'Deleted product')}</b><div class="meta">Need ${item.remaining} ${esc(p?.unit||'unit')} · ${item.status==='out'?'Out of stock':'Low stock'}</div></div></div><div class="actions"><button class="primary" onclick="buy(${item.id})">✓ Bought</button><button class="outline" onclick="partial(${item.id})">Partial purchase</button><button class="danger small" onclick="removeItem(${item.id})">Remove</button></div></div>`}).join(''):'<div class="empty"><div style="font-size:42px">📝</div><b>Parcha is empty</b><div>Add a product when you notice it is low or finished.</div></div>'}`}
function products(){let cats=['All',...new Set(db.products.map(p=>p.category).filter(Boolean))];let list=db.products.filter(p=>(filter==='All'||p.category===filter)&&p.name.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>b.freq-a.freq);document.getElementById('app').innerHTML=`<input class="search" value="${esc(search)}" placeholder="Search 500–2,000 products…" oninput="search=this.value;products()"><div class="chips">${cats.map(c=>`<button class="small" onclick="filter='${esc(c)}';products()">${esc(c)}</button>`).join('')}</div><div class="meta">${list.length} products · most frequently ordered first</div>${list.map(p=>`<div class="card"><div class="row"><div class="product"><div class="pic">📦</div><div><b>${esc(p.name)}</b><div class="meta">${esc(p.brand)} · ${esc(p.category)} · ${esc(p.unit)}</div><div class="meta">Cost ${esc(p.cost)} · Sell ${esc(p.sell)} · ordered ${p.freq}×</div></div></div><button class="small outline" onclick="addToParcha(${p.id})">Add</button></div></div>`).join('')}`}
function history(){document.getElementById('app').innerHTML=`<div class="title" style="margin-top:5px">Purchase History</div>${db.history.length?db.history.slice().reverse().map(h=>`<div class="card"><div class="row"><b>${esc(h.name)}</b><span class="pill green">Bought ${h.qty}</span></div><div class="meta">${new Date(h.at).toLocaleString()}</div></div>`).join(''):'<div class="empty">Nothing bought yet.</div>'}`}
function addToParcha(pid){let p=db.products.find(x=>x.id===pid);p.freq++;openStock(p)}function openStock(p){document.getElementById('modal').classList.add('open');document.getElementById('sheet').innerHTML=`<div class="row"><h2 style="margin:0">${esc(p.name)}</h2><button class="small outline" onclick="closeModal()">✕</button></div><div class="meta">${esc(p.brand)} · ${esc(p.unit)}</div><div class="title">What did you notice?</div><div class="statusBtns"><button id="ok" onclick="pick('ok')">🟢 Enough</button><button id="low" onclick="pick('low')">🟡 Low</button><button id="out" onclick="pick('out')">🔴 Finished</button></div><div class="field"><label>How much should we buy?</label><input id="qty" type="number" min="1" placeholder="e.g. 20"></div><button class="primary" style="width:100%" onclick="saveParcha(${p.id})">Add to Parcha</button>`;window.sel='low'}function pick(s){window.sel=s;['ok','low','out'].forEach(x=>document.getElementById(x).className='');document.getElementById(s).className='sel-'+s}function saveParcha(pid){let q=Number(document.getElementById('qty').value||1);let found=db.parcha.find(x=>x.pid===pid);if(found)found.remaining+=q;else db.parcha.push({id:Date.now(),pid,status:window.sel==='ok'?'low':window.sel,remaining:q});save();closeModal();render()}
function buy(id){let i=db.parcha.findIndex(x=>x.id===id);if(i<0)return;let x=db.parcha[i],p=db.products.find(q=>q.id===x.pid);db.history.push({name:p.name,qty:x.remaining,at:Date.now()});db.parcha.splice(i,1);save();render()}function partial(id){let x=db.parcha.find(q=>q.id===id),p=db.products.find(q=>q.id===x.pid);let got=prompt(`Need ${x.remaining} ${p.unit}. How many did you buy?`);if(got===null)return;got=Math.max(0,Math.min(Number(got)||0,x.remaining));if(got===0)return;db.history.push({name:p.name,qty:got,at:Date.now()});x.remaining-=got;if(!x.remaining)db.parcha=db.parcha.filter(q=>q.id!==id);save();render()}function removeItem(id){db.parcha=db.parcha.filter(x=>x.id!==id);save();render()}function clearBought(){go('history')}
function openAdd(){document.getElementById('modal').classList.add('open');document.getElementById('sheet').innerHTML=`<div class="row"><h2 style="margin:0">Add Product</h2><button class="small outline" onclick="closeModal()">✕</button></div><div class="field"><label>Product name</label><input id="n" placeholder="e.g. Maggi 70g"></div><div class="field"><label>Brand</label><input id="b"></div><div class="field"><label>Category</label><input id="c" placeholder="Biscuits, Grocery, Soap…"></div><div class="field"><label>Unit</label><select id="u"><option>pcs</option><option>packet</option><option>box</option><option>kg</option><option>ltr</option><option>bottle</option><option>dozen</option></select></div><div class="field"><label>Purchase / cost price</label><input id="co" placeholder="₹"></div><div class="field"><label>Selling price</label><input id="se" placeholder="₹"></div><button class="primary" style="width:100%" onclick="createProduct()">Save Product</button>`}function createProduct(){let name=document.getElementById('n').value.trim();if(!name)return alert('Enter product name');db.products.push({id:Date.now(),name,brand:document.getElementById('b').value,category:document.getElementById('c').value||'Other',unit:document.getElementById('u').value,cost:document.getElementById('co').value,sell:document.getElementById('se').value,freq:0,status:'ok'});save();closeModal();go('products')}function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();
</script></body></html>
